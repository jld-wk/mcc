fail_fast: true
repos:
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [-i, --style=file]
        exclude: (^vendor/|source.c)
      - id: clang-tidy
        args: [-p=build]
        exclude: (^vendor/|source.c)
  - repo: local
    hooks:
      - id: cmake-tests
        name: CMake tests
        entry: bash -c 'cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure'
        language: system
        pass_filenames: false
        stages: [pre-commit]
